<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12151b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Blockwild: an original offline voxel survival sandbox." />
    <link rel="icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Blockwild</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12151b; }
      #boot-error[hidden] { display: none; }
      #boot-error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; color: #eef1f5; font: 16px system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui"></div>
    <div id="boot-error" hidden></div>
    <noscript><div style="color:#fff;padding:24px;font-family:sans-serif">Blockwild needs JavaScript enabled.</div></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
